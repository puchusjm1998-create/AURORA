# AURORA LOGISTICS AI — despliegue de referencia en cloud europea.
# Copie .env.example a .env, defina JWT_SECRET y POSTGRES_PASSWORD, y ejecute:
#   python backend/scripts/fetch_voice_model.py   # voz Piper local (180 MB, una vez)
#   docker compose up -d --build
#
# Servicios: PostgreSQL 16, Redis 7, API (FastAPI + frontend compilado),
# worker Celery, beat y un inicializador del modelo de voz. El puerto 8000
# queda delante de su proxy TLS (Caddy, Traefik o el balanceador del proveedor).

x-aurora-image: &aurora-image
  build:
    context: .
    dockerfile: Dockerfile
  image: aurora-app:${APP_VERSION:-0.1.0}

x-aurora-env: &aurora-env
  ENVIRONMENT: production
  APP_VERSION: ${APP_VERSION:-0.1.0}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aurora}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aurora}
  JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET de al menos 32 caracteres en .env}
  COOKIE_SECURE: "true"
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-480}
  DEMO_MODE: "false"
  WAREHOUSE_TIMEZONE: Europe/Madrid
  CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8000}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  # --- Almacenamiento documental -------------------------------------------
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_DIR: /app/backend/data/storage
  STORAGE_CACHE_DIR: /app/backend/data/cache/storage
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_PREFIX: ${S3_PREFIX:-aurora}
  S3_REGION: ${S3_REGION:-eu-west-1}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
  S3_TIMEOUT: ${S3_TIMEOUT:-30}
  # --- Cola ----------------------------------------------------------------
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}
  CELERY_TASK_ALWAYS_EAGER: "false"
  CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-300}
  # --- Voz ----------------------------------------------------------------
  VOICE_TTS_PROVIDER: ${VOICE_TTS_PROVIDER:-piper}
  VOICE_TTS_VOICE: ${VOICE_TTS_VOICE:-es_ES-davefx-medium}
  VOICE_TTS_MODEL_PATH: /app/backend/data/models/es_ES-davefx-medium.onnx
  VOICE_TTS_API_KEY: ${VOICE_TTS_API_KEY:-}
  VOICE_TTS_MODEL: ${VOICE_TTS_MODEL:-gpt-4o-mini-tts}
  VOICE_TTS_BASE_URL: ${VOICE_TTS_BASE_URL:-https://api.openai.com/v1}
  VOICE_TTS_TIMEOUT: ${VOICE_TTS_TIMEOUT:-30}
  VOICE_TTS_MAX_CHARS: ${VOICE_TTS_MAX_CHARS:-1200}
  VOICE_TTS_CACHE_DIR: /app/backend/data/cache/voice
  # --- Telefonía -----------------------------------------------------------
  TELEPHONY_MODE: ${TELEPHONY_MODE:-handoff}
  TELEPHONY_SIP_DOMAIN: ${TELEPHONY_SIP_DOMAIN:-}
  TELEPHONY_SIP_EXTENSION: ${TELEPHONY_SIP_EXTENSION:-}
  TELEPHONY_WEBHOOK_URL: ${TELEPHONY_WEBHOOK_URL:-}
  TELEPHONY_WEBHOOK_TOKEN: ${TELEPHONY_WEBHOOK_TOKEN:-}
  TELEPHONY_CALLBACK_TOKEN: ${TELEPHONY_CALLBACK_TOKEN:-}
  TELEPHONY_WEBHOOK_TIMEOUT: ${TELEPHONY_WEBHOOK_TIMEOUT:-10}
  # --- Correo --------------------------------------------------------------
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-aurora@localhost}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_SSL: ${SMTP_SSL:-false}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      TZ: Europe/Madrid
    volumes:
      - aurora-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurora} -d ${POSTGRES_DB:-aurora}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aurora
    # No publique el puerto de la base de datos salvo para administración puntual.

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - aurora-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - aurora
    # Broker interno: no se publica el puerto.

  voice-model:
    <<: *aurora-image
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        if [ "$${VOICE_TTS_PROVIDER:-piper}" = "piper" ]; then
          python scripts/fetch_voice_model.py
        else
          echo "VOICE_TTS_PROVIDER=$${VOICE_TTS_PROVIDER}; no se descarga Piper"
        fi
    environment:
      VOICE_TTS_PROVIDER: ${VOICE_TTS_PROVIDER:-piper}
    volumes:
      - aurora-models:/app/backend/data/models
    networks:
      - aurora

  api:
    <<: *aurora-image
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      voice-model:
        condition: service_completed_successfully
    environment:
      <<: *aurora-env
      AURORA_BOOTSTRAP: "true"
      AURORA_RUN_MIGRATIONS: "true"
      AURORA_ADMIN_EMAIL: ${AURORA_ADMIN_EMAIL:?Defina el correo del administrador en .env}
      AURORA_ADMIN_PASSWORD: ${AURORA_ADMIN_PASSWORD:?Defina la contraseña inicial del administrador en .env}
      AURORA_ADMIN_NAME: ${AURORA_ADMIN_NAME:-Administrador AURORA}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - aurora-storage:/app/backend/data/storage
      - aurora-cache:/app/backend/data/cache
      - aurora-models:/app/backend/data/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - aurora

  worker:
    <<: *aurora-image
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
        "--max-tasks-per-child=200",
      ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      voice-model:
        condition: service_completed_successfully
    environment:
      <<: *aurora-env
      AURORA_BOOTSTRAP: "false"
      AURORA_RUN_MIGRATIONS: "false"
    volumes:
      - aurora-storage:/app/backend/data/storage
      - aurora-cache:/app/backend/data/cache
      - aurora-models:/app/backend/data/models
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - aurora

  beat:
    <<: *aurora-image
    restart: unless-stopped
    command:
      ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      <<: *aurora-env
      AURORA_BOOTSTRAP: "false"
      AURORA_RUN_MIGRATIONS: "false"
    volumes:
      - aurora-storage:/app/backend/data/storage
      - aurora-cache:/app/backend/data/cache
      - aurora-models:/app/backend/data/models
    networks:
      - aurora

volumes:
  aurora-db:
  aurora-redis:
  aurora-storage:
  aurora-cache:
  aurora-models:

networks:
  aurora:
    driver: bridge
